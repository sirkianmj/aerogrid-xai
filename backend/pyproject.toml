[project]
name = "aerogrid-xai-backend"
version = "0.1.0"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "."
explicit_package_bases = true
warn_unused_ignores = true
warn_redundant_casts = true
