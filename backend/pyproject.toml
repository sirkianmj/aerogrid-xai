[project]
name = "aerogrid-xai-backend"
version = "0.1.0"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "."
explicit_package_bases = true
warn_unused_ignores = true
warn_redundant_casts = true

# scipy is installed from conda-forge without PEP 561 type markers. Under
# strict mode mypy refuses to analyse the imports by default. This override
# tells mypy to trust scipy's runtime behaviour without static checking;
# the code paths that use scipy are covered by pytest tests.
[[tool.mypy.overrides]]
module = ["scipy.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [".git", "__pycache__", ".pytest_cache", ".mypy_cache", ".ruff_cache", "build", "dist"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "C4", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
