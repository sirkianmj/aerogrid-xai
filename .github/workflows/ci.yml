name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Miniforge
        uses: conda-incubator/setup-miniconda@v3
        with:
          environment-file: environment.yml
          activate-environment: aerogrid
          miniforge-version: latest
      - name: Lint with ruff
        run: |
          cd backend
          ruff check .
        shell: bash -el {0}
      - name: Format check with ruff
        run: |
          cd backend
          ruff format --check .
        shell: bash -el {0}
      - name: Type check with mypy
        run: |
          cd backend
          mypy .
        shell: bash -el {0}
      - name: Test with pytest
        run: |
          cd backend
          pytest --cov=app --cov-report=xml
        shell: bash -el {0}

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint with oxlint
        run: npm run lint
      - name: Type check with tsc
        run: npm run typecheck
      - name: Test with vitest
        run: npm run test
      - name: Build
        run: npm run build

  cla-check:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify PR author is in signatures/cla-v1.json
        run: |
          AUTHOR="${{ github.event.pull_request.user.login }}"
          echo "PR author: $AUTHOR"
          if grep -q "\"$AUTHOR\"" signatures/cla-v1.json; then
            echo "CLA signed."
          else
            echo "CLA not signed for $AUTHOR. Add yourself to signatures/cla-v1.json in this PR."
            exit 1
          fi

  formal-verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Miniforge
        uses: conda-incubator/setup-miniconda@v3
        with:
          environment-file: environment.yml
          activate-environment: aerogrid
          miniforge-version: latest
      - name: Run Z3 sanity check
        run: |
          python -c "from z3 import *; x = Int('x'); s = Solver(); s.add(x > 2); s.add(x < 1); assert s.check() == unsat; print('Z3 sanity check passed')"
        shell: bash -el {0}
