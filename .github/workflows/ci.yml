name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Miniforge
        uses: conda-incubator/setup-miniconda@v3
        with:
          environment-file: environment.yml
          activate-environment: aerogrid
          miniforge-version: latest
      - name: Lint with ruff
        run: |
          cd backend
          ruff check .
        shell: bash -el {0}
      - name: Format check with ruff
        run: |
          cd backend
          ruff format --check .
        shell: bash -el {0}
      - name: Type check with mypy
        run: |
          cd backend
          mypy .
        shell: bash -el {0}
      - name: Test with pytest
        run: |
          cd backend
          pytest --cov=app --cov-report=xml
        shell: bash -el {0}

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint with oxlint
        run: npm run lint
      - name: Type check with tsc
        run: npm run typecheck
      - name: Test with vitest
        run: npm run test
      - name: Build
        run: npm run build

  rls-isolation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aerogrid
          POSTGRES_DB: aerogrid
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aerogrid -d aerogrid"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Set up Miniforge
        uses: conda-incubator/setup-miniconda@v3
        with:
          environment-file: environment.yml
          activate-environment: aerogrid
          miniforge-version: latest
      - name: Wait for PostgreSQL to accept connections
        run: |
          for i in $(seq 1 30); do
            if pg_isready -h 127.0.0.1 -p 5432 -U aerogrid -d aerogrid; then
              exit 0
            fi
            sleep 1
          done
          echo "PostgreSQL did not become ready in 30 seconds"
          exit 1
        shell: bash -el {0}
      - name: Apply the RLS migration
        run: |
          psql -h 127.0.0.1 -p 5432 -U aerogrid -d aerogrid \
            -v ON_ERROR_STOP=1 \
            -f backend/app/saas/migrations/001_rls_setup.sql
        shell: bash -el {0}
      - name: Run the RLS isolation tests
        env:
          AEROGRID_DATABASE_URL: postgresql+psycopg2://aerogrid@127.0.0.1:5432/aerogrid
        run: |
          cd backend
          pytest tests/test_rls_isolation.py -v
        shell: bash -el {0}

  cla-check:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify PR author is in signatures/cla-v1.json
        run: |
          AUTHOR="${{ github.event.pull_request.user.login }}"
          echo "PR author: $AUTHOR"
          if grep -q "\"$AUTHOR\"" signatures/cla-v1.json; then
            echo "CLA signed."
          else
            echo "CLA not signed for $AUTHOR. Add yourself to signatures/cla-v1.json in this PR."
            exit 1
          fi

  formal-verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Miniforge
        uses: conda-incubator/setup-miniconda@v3
        with:
          environment-file: environment.yml
          activate-environment: aerogrid
          miniforge-version: latest
      - name: Run Z3 sanity check
        run: |
          python -c "from z3 import *; x = Int('x'); s = Solver(); s.add(x > 2); s.add(x < 1); assert s.check() == unsat; print('Z3 sanity check passed')"
        shell: bash -el {0}
