# Grafana data source provisioning.
#
# Declares the local Prometheus instance as the default data source.
# The uid is pinned so dashboards can reference it by a stable string
# that survives a Grafana reinstall.

apiVersion: 1

datasources:
  - name: Prometheus
    uid: aerogrid-prometheus
    type: prometheus
    access: proxy
    url: http://localhost:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 15s
      httpMethod: POST
